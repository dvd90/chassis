name: Docs

# Builds site/dist/index.html from the markdown in docs/ and publishes it to
# GitHub Pages. Enable Pages once in Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the docs site
        run: npm ci --prefix site && npm run build --prefix site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deploy
        uses: actions/deploy-pages@v4
